# ============================================
# Smart Parking System
# Jetson Orin Nano | DeepStream | Web Dashboard
# ============================================

camera:
  # plate: "rtmp://192.168.1.13/live/plate"
  # face: "rtmp://192.168.1.13/live/face"
  # plate: "rtmp://192.168.118.112/live/plate"
  # face: "rtmp://192.168.118.112/live/face"
  plate: "rtmp://192.168.118.108/live/plate"
  face: "rtmp://192.168.118.108/live/face"
  hw_decode: true
  process_every_n: 1     # Chỉ áp dụng cho fallback path (DS path dùng
                         # deepstream.face_det_interval / plate_det_interval).
  reconnect_sec: 3
  face_rotate: -1        # cv2 code 0/1/2/3, -1 = chưa setup (chạy setup_rotation.py)
  face_rotate_nv: 0    # nvvidconv flip-method tương ứng (auto-write bởi setup script)

# DeepStream pipeline (tắt = fallback GStreamer + Python inference)
deepstream:
  enabled: true
  plate_enabled: true
  face_enabled: true
  plate_config: "./configs/plate_det_config.txt"
  plate_ocr_config: "./configs/plate_ocr_config.txt"
  face_det_config: "./configs/face_det_config.txt"
  # Face chain: SCRFD det → nvdsfaceembed (CUDA align + TensorRT ArcFace,
  # embedding attached as PARKING.FACE_EMBEDDING_META on obj_meta).
  face_embed_engine: "./models/face_embed_arcface_fp16.engine"
  face_embed_batch_size: 8
  face_embed_align_on_gpu: true
  face_embed_allow_cpu_fallback: true
  # nvdsfaceembed v2+: plugin tự tính blur+brightness quality. Set 0.0 để
  # disable plugin-side skip (vẫn fill meta.quality nếu < min_quality).
  face_embed_min_quality: 0.3
  # SCRFD anchor score threshold. Plugin tự decode + NMS (parser là no-op),
  # giá trị này là source of truth duy nhất — pre-cluster-threshold trong
  # face_det_config.txt KHÔNG dùng nữa.
  face_embed_decode_conf_threshold: 0.50
  # Bật log thống kê probe mỗi 5s (face_frames/dets/emb/err).
  debug_probe: true
  # nvinfer interval=N → chạy 1 frame, skip N frame. 0 = không skip (full
  # quality, default). Tăng để giảm GPU; rủi ro miss mặt xuất hiện <1/(N+1)
  # khung hình. Không khai báo = giữ giá trị trong .txt config (mặc định 0).
  # face_det_interval: 0
  # plate_det_interval: 0

  # nvtracker (NvDCF) giữa SCRFD và nvdsfaceembed. Gán object_id ổn định
  # qua frame → bỏ logic cosine-sim trong Python, cho phép interval-skip ở
  # plugin embed mà không mất identity continuity.
  face_tracker_config: "./configs/tracker_face_nvdcf.yml"
  face_tracker_width: 960
  face_tracker_height: 544
  # face_embed_interval=N → plugin chỉ embed lại mỗi N+1 frame cho cùng
  # track. Sau khi tách scrfddec/embed + tracker chèn giữa, object_id ổn
  # định trước khi embed plugin chạy → knob này thật sự hiệu lực.
  # N=2 ≈ embed 1/3 frame mỗi track (cắt ~67% ArcFace inference). Track mới
  # trong probationAge=2 vẫn embed mỗi frame (object_id=UNTRACKED).
  face_embed_interval: 2

plate_detector:
  model: "./models/plate_yolov8n.pt"
  engine: "./models/plate_yolov8n.engine"
  imgsz: 640
  conf: 0.5
  device: 0

# ★ v5: YOLO char detection thay PaddleOCR
plate_ocr:
  # YOLO mode (mặc định) — nhanh, chính xác
  backend: "yolo"                           # "yolo" hoặc "paddle" (fallback)
  model: "./models/plate_ocr_yolov8n.pt"
  imgsz: 320
  conf: 0.4
  device: 0
  # PaddleOCR fallback (dùng khi backend: "paddle")
  lang: "en"
  use_gpu: true

face:
  # model_pack/det_size dùng cho InsightFace fallback khi DeepStream tắt.
  model_pack: "buffalo_sc"
  det_size: [640, 640]
  blur_threshold: 10.0
  min_quality: 0.3                   # per-frame quality gate (fallback path)

recognition:
  face_threshold: 0.3
  plate_vote_frames: 5
  # IdentityTracker — session-level embedding aggregator (sau khi có
  # nvtracker, identity continuity qua frame do DS lo, không còn cosine
  # sim / IoU bridge ở tầng Python).
  max_identities: 3                  # xe chở 2 người + dự phòng
  min_seed_quality: 0.3              # quality min để seed slot mới
  identity_min_hits: 2               # số frame min trước khi slot được commit
  identity_stale_frames: 60          # dọn slot nếu track không xuất hiện N frame
  plate_regex: "^\\d{2}[A-Z]\\d?-?\\d{3,5}\\.?\\d{0,2}$"

database:
  host: "localhost"
  port: 5432
  dbname: "parking"
  user: "parking"
  password: "parking123"
  max_capacity: 500

# Web dashboard (FastAPI + WebSocket)
web:
  enabled: true
  host: "0.0.0.0"
  port: 8080

display:
  show: false      # Tắt cv2.imshow khi dùng web dashboard
  window_width: 1280
